[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-firewall-windows"
version = "0.2.2"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Windows Firewall for Liminal: Windows Defender Firewall, the networks and Microsoft Defender on this PC, every rule and profile read, queried and changed on your word."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.1)
dependencies = ["liminal-libs>=1.34.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
firewall-windows = "plugin_platform_firewall_windows"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the one PowerShell read of the whole configuration
plugin_platform_firewall_windows = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
