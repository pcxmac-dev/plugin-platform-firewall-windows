[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-firewall-windows"
version = "0.7.2"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = """\
  Windows Firewall for Liminal: Windows Defender Firewall, the networks and Microsoft Defender on this PC, every \
  rule and profile read, queried and changed on your word; the World Wide Web tab: this PC's traffic on a globe; and \
  the Netstat tab: the listening ports and the connections with their programs, the hosts each program talks with \
  recorded on this PC, and the globe filtered by them over the internet's infrastructure."""
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.2: what it attaches to, 1.49.0; the
# Firewall base's World Wide Web tab, 1.55.0; its Netstat tab, hosts database and globe layers, 1.65.0; the Topology
# Zoo's maps, its gml format, 1.65.1), with its geo extra: maxminddb, which reads the GeoIP file the tabs place with.
# On an older library the plugin still loads, its World Wide Web tab as 0.6.1 had it (it feature-detects the Netstat
# tab: netstat_in); on 1.65.0 the Topology Zoo's data set alone is left out, in words
dependencies = ["liminal-libs[geo]>=1.65.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
firewall-windows = "plugin_platform_firewall_windows"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the one PowerShell read of the whole configuration
plugin_platform_firewall_windows = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
